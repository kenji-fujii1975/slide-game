<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Frog Dodge – 3 Stages</title>
  <style>
    :root {
      --fg: #e2e8f0;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background: #0a2a6b; color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Hiragino Kaku Gothic ProN", Meiryo, "Noto Sans JP", sans-serif; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows: 1fr auto; }
    canvas { width:100%; height:100%; display:block; }

    .hud { position: fixed; inset: env(safe-area-inset-top) 0 auto 0; padding: 8px 12px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; gap:8px; }
    .badge { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }

    .overlay { position: fixed; inset:0; display:grid; place-items:center; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); }
    .card { width:min(92vw, 560px); border-radius: 20px; padding: 20px; background: rgba(14,18,30,0.9); border:1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .card h1 { margin: 6px 0 12px; font-size: clamp(20px, 5vw, 28px); letter-spacing: 0.02em; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn { pointer-events:auto; appearance:none; border:none; border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700; color:#0b0f1a; background: #5eead4; box-shadow: 0 4px 14px rgba(0,0,0,0.25), inset 0 -2px 0 rgba(0,0,0,0.25); }
    .btn.secondary { background: #a78bfa; color:#0b0f1a; }
    .btn.ghost { background: rgba(255,255,255,0.1); color: var(--fg); border:1px solid rgba(255,255,255,0.15); }

    .controlsHint { position: fixed; inset:auto 0 env(safe-area-inset-bottom) 0; display:flex; justify-content:space-between; align-items:center; pointer-events:none; padding: 16px; opacity: 0.85; font-size: 12px; color: #cbd5e1; }
    .controlsHint .zone { width: 46%; text-align:center; padding: 10px 0; border: 1px dashed rgba(255,255,255,0.18); border-radius: 14px; background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="hud">
  <div class="badge" id="stage">STAGE 1</div>
  <div class="badge" id="timer">TIME 30.0s</div>
  <div class="badge" id="score">SCORE 0000</div>
  <div class="badge" id="best">BEST 0000</div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>🐸 Frog Dodge – 3 Stages</h1>
    <p style="color:#c7d2fe">30秒避け続けるとGOAL！<br>ステージ1: 青 / 亀　→　ステージ2: 緑 / 蟹　→　ステージ3: 黒 / 蛇</p>
    <ul style="margin: 0 0 12px 1.2em; line-height:1.6; color:#c7d2fe">
      <li>速度は<strong>各ステージ一定</strong>（時間で速くならない）</li>
      <li>左/右タッチ or 傾きで移動</li>
      <li>リスタート時のBGM重複を防止</li>
    </ul>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="startBtn">START</button>
      <button class="btn secondary" id="tiltBtn">Enable Tilt</button>
      <button class="btn ghost" id="muteBtn">🔈 BGM/SFX</button>
    </div>
  </div>
</div>

<div class="controlsHint" id="touchHints" style="display:none">
  <div class="zone">⬅️ LEFT</div>
  <div class="zone">RIGHT ➡️</div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const stageEl = document.getElementById('stage');
  const timerEl = document.getElementById('timer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const menu = document.getElementById('menu');
  const startBtn = document.getElementById('startBtn');
  const tiltBtn = document.getElementById('tiltBtn');
  const muteBtn = document.getElementById('muteBtn');
  const touchHints = document.getElementById('touchHints');

  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // -------- Stage config (constant speeds per stage) --------
  const STAGES = [
    { name: 'STAGE 1', secs: 30, bg: '#0a2a6b', bg2:'#1d4ed8', enemy:'turtle', speed:[21,30], spawnEvery: 1000 },
    { name: 'STAGE 2', secs: 30, bg: '#064e3b', bg2:'#16a34a', enemy:'crab',   speed:[24,33], spawnEvery: 950 },
    { name: 'STAGE 3', secs: 30, bg: '#000000', bg2:'#111827', enemy:'snake',  speed:[27,36], spawnEvery: 900 },
  ];

  // -------- State --------
  const state = {
    running:false,
    stageIdx:0,
    stageElapsed:0,
    last:performance.now(),
    score:0,
    best: parseInt(localStorage.getItem('db_best')||'0',10),
    player:{ x:0.5, y:0.85, r:18, vx:0, animT:0 },
    blocks:[], spawnAcc:0,
    input:{ left:false, right:false, tilt:0 },
    muted:false,
  };
  bestEl.textContent = `BEST ${state.best.toString().padStart(4,'0')}`;

  // -------- Input --------
  let touchingLeft=false, touchingRight=false;
  function onTouch(e){ if(!state.running) return; for(const t of e.touches){ const half=window.innerWidth/2; if(t.clientX<half) touchingLeft=true; else touchingRight=true; } }
  function onEnd(){ touchingLeft=false; touchingRight=false; }
  window.addEventListener('touchstart', onTouch, {passive:true});
  window.addEventListener('touchmove', onTouch, {passive:true});
  window.addEventListener('touchend', onEnd, {passive:true});
  window.addEventListener('touchcancel', onEnd, {passive:true});

  // Optional tilt
  let tiltEnabled=false;
  tiltBtn.addEventListener('click', async () => {
    try{
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
        const perm = await DeviceMotionEvent.requestPermission(); if(perm!=='granted') throw new Error('permission denied');
      }
      window.addEventListener('devicemotion', (ev)=>{ const ax = ev.accelerationIncludingGravity ? ev.accelerationIncludingGravity.x||0 : 0; state.input.tilt = Math.max(-1, Math.min(1, -ax/5)); });
      tiltEnabled = true; tiltBtn.textContent='Tilt ✅';
    }catch(e){ alert('デバイスの傾き取得が許可されませんでした'); }
  });

  // -------- Audio (BGM + SFX) --------
  let audioCtx, masterGain, bgmGain, sfxGain, bgmTimer=null, bgmRunning=false;
  function setupAudio(){ if(audioCtx) return; audioCtx = new (window.AudioContext||window.webkitAudioContext)(); masterGain=audioCtx.createGain(); masterGain.gain.value=1.0; masterGain.connect(audioCtx.destination); bgmGain=audioCtx.createGain(); bgmGain.gain.value=0.12; bgmGain.connect(masterGain); sfxGain=audioCtx.createGain(); sfxGain.gain.value=0.25; sfxGain.connect(masterGain); }
  function tone({type='square', freq=440, start=0, dur=0.1, vol=0.2, target=sfxGain}){ const osc=audioCtx.createOscillator(); const g=audioCtx.createGain(); osc.type=type; osc.frequency.value=freq; g.gain.value=0; osc.connect(g).connect(target); g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol,start+0.005); g.gain.exponentialRampToValueAtTime(0.0001,start+dur); osc.start(start); osc.stop(start+dur+0.05); }
  function noiseHat(start){ const buffer=audioCtx.createBuffer(1, audioCtx.sampleRate*0.05, audioCtx.sampleRate); const data=buffer.getChannelData(0); for(let i=0;i<data.length;i++){ data[i]=(Math.random()*2-1)*(1-i/data.length);} const src=audioCtx.createBufferSource(); const g=audioCtx.createGain(); g.gain.value=0.18; src.buffer=buffer; src.connect(g).connect(bgmGain); src.start(start); }
  function startBGM(){ if(!audioCtx) setupAudio(); if(state.muted) return; if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } bgmRunning=true; bgmGain.gain.cancelScheduledValues(audioCtx.currentTime); bgmGain.gain.value=0; bgmGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime+0.15); const tempo=140, beat=60/tempo, now=audioCtx.currentTime+0.05; const chords=[[261.63,329.63,392.00],[196.00,246.94,392.00],[220.00,261.63,329.63],[174.61,220.00,261.63]]; const bars=4, barLen=4*beat; for(let bar=0; bar<bars; bar++){ const t0=now+bar*barLen; const chord=chords[bar%chords.length]; tone({type:'triangle',freq:chord[0]/2,start:t0+0*beat,dur:0.2,vol:0.28,target:bgmGain}); tone({type:'triangle',freq:chord[0]/2,start:t0+2*beat,dur:0.2,vol:0.28,target:bgmGain}); for(let i=0;i<8;i++){ noiseHat(t0+i*(beat/2)); } for(let i=0;i<8;i++){ const n=chord[i%chord.length]; tone({type:'square',freq:n*2,start:t0+i*(beat/2),dur:0.17,vol:0.22,target:bgmGain}); } for(let i=0;i<4;i++){ for(const n of chord){ tone({type:'square',freq:n,start:t0+i*beat+beat*0.5,dur:0.13,vol:0.12,target:bgmGain}); } } for(let i=0;i<4;i++){ tone({type:'sine',freq:80,start:t0+i*beat,dur:0.12,vol:0.35,target:bgmGain}); } } const loopLen=bars*barLen; bgmTimer=setInterval(()=>{ if(!bgmRunning||state.muted){ clearInterval(bgmTimer); bgmTimer=null; return; } startBGM(); }, loopLen*1000); }
  function stopBGM(){ if(!audioCtx) return; bgmRunning=false; if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } const t=audioCtx.currentTime; bgmGain.gain.cancelScheduledValues(t); bgmGain.gain.setTargetAtTime(0.0, t, 0.05); }
  function sfxMove(){ if(!audioCtx||state.muted) return; const t=audioCtx.currentTime; tone({type:'square',freq:900,start:t,dur:0.03,vol:0.12}); }
  function sfxSpawn(){ if(!audioCtx||state.muted) return; const t=audioCtx.currentTime; tone({type:'square',freq:500,start:t,dur:0.05,vol:0.15}); }
  function sfxHit(){ if(!audioCtx||state.muted) return; const t=audioCtx.currentTime; tone({type:'triangle',freq:120,start:t,dur:0.25,vol:0.35}); tone({type:'sawtooth',freq:60,start:t+0.02,dur:0.25,vol:0.25}); }
  function sfxGoal(){ if(!audioCtx||state.muted) return; const t=audioCtx.currentTime; [0,3,7,12].forEach((i,idx)=>tone({type:'square',freq:261.63*Math.pow(2,i/12),start:t+idx*0.08,dur:0.12,vol:0.25})); }
  function sfxEnding(){ if(!audioCtx||state.muted) return; const t=audioCtx.currentTime; [0,4,7,12,7,12,16].forEach((i,idx)=>tone({type:'triangle',freq:261.63*Math.pow(2,i/12),start:t+idx*0.12,dur:0.18,vol:0.28})); }

  muteBtn.addEventListener('click',()=>{ state.muted=!state.muted; muteBtn.textContent = state.muted ? '🔇 MUTED' : '🔈 BGM/SFX'; if(!audioCtx) setupAudio(); if(state.muted) stopBGM(); else startBGM(); });

  // -------- Helpers --------
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }

  function resetForStage(){
    state.blocks.length=0; state.spawnAcc=0; state.stageElapsed=0; state.player.x=0.5; state.player.vx=0; state.player.animT=0; touchHints.style.display='flex';
    stageEl.textContent = STAGES[state.stageIdx].name; updateTimerBadge();
  }

  function updateTimerBadge(){ const remain = Math.max(0, STAGES[state.stageIdx].secs*1000 - state.stageElapsed); timerEl.textContent = `TIME ${(remain/1000).toFixed(1)}s`; }

  function spawnBlock(){
    const cfg = STAGES[state.stageIdx];
    const w = window.innerWidth, h = window.innerHeight;
    const sizeBase = Math.max(34, w*0.06), sizeMax = Math.max(60, w*0.12);
    const size = rand(sizeBase, sizeMax);
    const x = rand(size/2, w - size/2);
    const speed = rand(cfg.speed[0], cfg.speed[1]); // 一定レンジ、時間で加速しない
    const e = { x, y: -size, w: size, h: size*0.75, vy: speed, rot: rand(-0.1,0.1) };
    state.blocks.push(e);
    sfxSpawn();
  }

  function collideCircleRect(cx, cy, r, rx, ry, rw, rh){ const nx=clamp(cx,rx,rx+rw); const ny=clamp(cy,ry,ry+rh); const dx=cx-nx, dy=cy-ny; return (dx*dx+dy*dy)<=r*r; }

  // -------- Drawing --------
  function drawBackground(){
    const {bg,bg2} = STAGES[state.stageIdx];
    const w = window.innerWidth, h = window.innerHeight;
    const g = ctx.createRadialGradient(w/2, h*0.1, Math.min(w,h)*0.1, w/2, h/2, Math.max(w,h)*0.9);
    g.addColorStop(0, bg2); g.addColorStop(1, bg);
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  }

  function drawGrid(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.globalAlpha=0.08; ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
    for(let y=0;y<h;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    for(let x=0;x<w;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    ctx.globalAlpha=1;
  }

  function drawFrog(x,y,r,t){
    const bob=Math.sin(t*4)*3, squash=1+Math.sin(t*8)*0.03, blink=(Math.floor((t%5)*10)===0);
    ctx.save(); ctx.translate(x,y+bob); ctx.scale(squash,1/squash);
    ctx.fillStyle='#22c55e'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    const ey=-r*0.7, ex=r*0.55; ctx.fillStyle='white';
    if(!blink){ ctx.beginPath(); ctx.arc(-ex,ey,r*0.22,0,Math.PI*2); ctx.arc(ex,ey,r*0.22,0,Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-ex,ey,r*0.09,0,Math.PI*2); ctx.arc(ex,ey,r*0.09,0,Math.PI*2); ctx.fill(); }
    else { ctx.strokeStyle='black'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-ex-r*0.2,ey); ctx.lineTo(-ex+r*0.2,ey); ctx.moveTo(ex-r*0.2,ey); ctx.lineTo(ex+r*0.2,ey); ctx.stroke(); }
    ctx.strokeStyle='black'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,r*0.15,r*0.45,0,Math.PI); ctx.stroke();
    ctx.restore();
  }

  function drawTurtle(x,y,w,h,rot){
    // 画像風のシンプルなシルエット（提供の参考画像に寄せた形）
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    const color = '#0f172a'; // 濃紺シルエット
    ctx.fillStyle = color; ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = Math.max(1, w*0.02);

    // 胴（甲羅：縦楕円）
    ctx.beginPath(); ctx.ellipse(0, 0, w*0.38, h*0.48, 0, 0, Math.PI*2); ctx.fill();

    // 頭
    ctx.beginPath(); ctx.ellipse(0, -h*0.58, w*0.14, h*0.14, 0, 0, Math.PI*2); ctx.fill();

    // 前ヒレ（左右）
    ctx.beginPath(); ctx.ellipse(-w*0.55, -h*0.15, w*0.35, h*0.18, -0.35, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( w*0.55, -h*0.15, w*0.35, h*0.18,  0.35, 0, Math.PI*2); ctx.fill();

    // 後ろ足（左右）
    ctx.beginPath(); ctx.ellipse(-w*0.28,  h*0.55, w*0.18, h*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( w*0.28,  h*0.55, w*0.18, h*0.18, 0, 0, Math.PI*2); ctx.fill();

    // 甲羅模様を細線で（シンプルに）
    ctx.beginPath(); ctx.moveTo(0, -h*0.45); ctx.lineTo(0, h*0.45); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, w*0.26, h*0.34, 0, 0, Math.PI*2); ctx.stroke();

    ctx.restore();
  }); ctx.restore(); }

  function drawCrab(x,y,w,h,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); const bodyW=w*0.7, bodyH=h*0.6; ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.ellipse(0,0,bodyW/2,bodyH/2,0,0,Math.PI*2); ctx.fill(); // eyes
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-bodyW*0.15,-bodyH*0.6,bodyH*0.12,0,Math.PI*2); ctx.arc(bodyW*0.15,-bodyH*0.6,bodyH*0.12,0,Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-bodyW*0.15,-bodyH*0.6,bodyH*0.06,0,Math.PI*2); ctx.arc(bodyW*0.15,-bodyH*0.6,bodyH*0.06,0,Math.PI*2); ctx.fill(); // legs
    ctx.strokeStyle='#b91c1c'; ctx.lineWidth=3; for(let i=-3;i<=3;i+=2){ ctx.beginPath(); ctx.moveTo(-bodyW*0.4, bodyH*0.1*i/3); ctx.lineTo(-bodyW*0.7, bodyH*0.2*i/3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(bodyW*0.4, bodyH*0.1*i/3); ctx.lineTo(bodyW*0.7, bodyH*0.2*i/3); ctx.stroke(); }
    // claws
    ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.ellipse(-bodyW*0.9,-bodyH*0.05,bodyW*0.25,bodyH*0.25,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(bodyW*0.9,-bodyH*0.05,bodyW*0.25,bodyH*0.25,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }

  function drawSnake(x,y,w,h,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); const len=h*1.2, thick=h*0.28; // long vertical segment
    const grad=ctx.createLinearGradient(0,-len/2,0,len/2); grad.addColorStop(0,'#22c55e'); grad.addColorStop(1,'#15803d'); ctx.fillStyle=grad; ctx.beginPath(); (function(){
      const rr = Math.min(thick*0.5, Math.abs(thick/2));
      ctx.beginPath();
      ctx.moveTo(-thick/2 + rr, -len/2);
      ctx.lineTo(thick/2 - rr, -len/2);
      ctx.arc(thick/2 - rr, -len/2 + rr, rr, -Math.PI/2, 0);
      ctx.lineTo(thick/2, len/2 - rr);
      ctx.arc(thick/2 - rr, len/2 - rr, rr, 0, Math.PI/2);
      ctx.lineTo(-thick/2 + rr, len/2);
      ctx.arc(-thick/2 + rr, len/2 - rr, rr, Math.PI/2, Math.PI);
      ctx.lineTo(-thick/2, -len/2 + rr);
      ctx.arc(-thick/2 + rr, -len/2 + rr, rr, Math.PI, -Math.PI/2);
      ctx.closePath();
      ctx.fill();
    })(); // head
    ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.ellipse(0,-len/2, thick*0.9, thick*0.9, 0, 0, Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-thick*0.25, -len/2, thick*0.12, 0, Math.PI*2); ctx.arc(thick*0.25, -len/2, thick*0.12, 0, Math.PI*2); ctx.fill(); ctx.restore(); }

  function draw(){
    drawBackground();
    drawGrid();
    const w = window.innerWidth, h = window.innerHeight;
    const px = state.player.x * w, py = state.player.y * h;
    drawFrog(px, py, state.player.r, state.player.animT/1000);
    const enemy = STAGES[state.stageIdx].enemy;
    for(const b of state.blocks){ if(enemy==='turtle') drawTurtle(b.x,b.y,b.w,b.h,b.rot); else if(enemy==='crab') drawCrab(b.x,b.y,b.w,b.h,b.rot); else drawSnake(b.x,b.y,b.w,b.h,b.rot); }
    // vignette
    const vg=ctx.createRadialGradient(w/2,h*0.4,Math.min(w,h)*0.1,w/2,h/2,Math.max(w,h)*0.8); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.35)'); ctx.fillStyle=vg; ctx.fillRect(0,0,w,h);
  }

  function update(dt){
    const w = window.innerWidth, h = window.innerHeight;

    // input
    const target = (touchingLeft? -1:0) + (touchingRight? 1:0) + (tiltEnabled? state.input.tilt*1.2 : 0);
    const accel=1.5; const prevVx=state.player.vx; state.player.vx += target*accel*dt/16.67; 
    // 速度上限（左右ボタンで一気に端へ行かないように）
    const maxVx = 0.35 * w / 1000; // 1秒で画面幅の35%
    if (state.player.vx >  maxVx) state.player.vx =  maxVx;
    if (state.player.vx < -maxVx) state.player.vx = -maxVx;
    state.player.vx *= 0.92; // 摩擦を強めて減速気味に
    state.player.x += (state.player.vx*dt)/w; state.player.x = clamp(state.player.x,0.05,0.95);
    if (Math.sign(prevVx)!==Math.sign(state.player.vx) && (touchingLeft||touchingRight||Math.abs(state.input.tilt)>0.05)) sfxMove();

    // spawn (fixed per stage)
    state.spawnAcc += dt; const cfg=STAGES[state.stageIdx];
    while(state.spawnAcc > cfg.spawnEvery){ state.spawnAcc -= cfg.spawnEvery; spawnBlock(); }

    // move enemies
    for(const b of state.blocks){ b.y += b.vy * dt/1000; b.rot += 0.0005*dt; }
    state.blocks = state.blocks.filter(b => b.y < h + b.h);

    // collisions
    const px=state.player.x*w, py=state.player.y*h, pr=state.player.r;
    for(const b of state.blocks){ if(collideCircleRect(px,py,pr, b.x-b.w/2, b.y-b.h/2, b.w, b.h)){ sfxHit(); endGame(false); return; } }

    // timer / score
    state.stageElapsed += dt; state.player.animT += dt; updateTimerBadge();
    state.score = Math.floor((state.score + dt/10)); scoreEl.textContent = `SCORE ${Math.floor(state.score).toString().padStart(4,'0')}`;

    // goal
    if (state.stageElapsed >= cfg.secs*1000){ endGame(true); }
  }

  function gameLoop(){ if(!state.running) return; const now=performance.now(); let dt=now-state.last; if(dt>80) dt=80; state.last=now; update(dt); draw(); requestAnimationFrame(gameLoop); }

  function startGame(){
    state.stageIdx = 0; state.score = 0; resetForStage(); state.running=true; state.last=performance.now(); menu.style.display='none'; touchHints.style.display='flex'; if(!state.muted){ setupAudio(); audioCtx.resume(); startBGM(); } requestAnimationFrame(gameLoop);
  }

  function nextStage(){ state.stageIdx++; if(state.stageIdx >= STAGES.length){ showEnding(); return; } resetForStage(); state.running=true; state.last=performance.now(); requestAnimationFrame(gameLoop); }

  function endGame(cleared){
    state.running=false; touchHints.style.display='none';
    if(!cleared){
      stopBGM();
      if (state.score > state.best){ state.best = Math.floor(state.score); localStorage.setItem('db_best', String(state.best)); }
      bestEl.textContent = `BEST ${state.best.toString().padStart(4,'0')}`;
      const again=document.createElement('div'); again.className='overlay'; again.innerHTML=`
        <div class="card">
          <h1>Game Over 💥</h1>
          <p style="color:#c7d2fe">ステージ: <strong>${STAGES[state.stageIdx].name}</strong></p>
          <div class="row" style="margin-top:8px">
            <button class="btn" id="retryBtn">RETRY</button>
          </div>
        </div>`; document.body.appendChild(again);
      document.getElementById('retryBtn').addEventListener('click', ()=>{ document.body.removeChild(again); startGame(); });
      return;
    }

    // Cleared
    sfxGoal();
    const clear=document.createElement('div'); clear.className='overlay'; clear.innerHTML=`
      <div class="card">
        <h1>GOAL ✅</h1>
        <p style="color:#c7d2fe">${STAGES[state.stageIdx].name} をクリア！</p>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="nextBtn">${state.stageIdx===STAGES.length-1?'ENDINGへ':'NEXT STAGE'}</button>
        </div>
      </div>`; document.body.appendChild(clear);
    document.getElementById('nextBtn').addEventListener('click', ()=>{ document.body.removeChild(clear); nextStage(); });
  }

  function showEnding(){
    sfxEnding(); stopBGM();
    const end=document.createElement('div'); end.className='overlay'; end.innerHTML=`
      <div class="card">
        <h1>🎉 CONGRATULATIONS!</h1>
        <p style="color:#c7d2fe; line-height:1.7">3ステージをクリアしました。<br>Game Designer: <strong>KENJI FUJII</strong></p>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="againBtn">PLAY AGAIN</button>
        </div>
      </div>`; document.body.appendChild(end);
    document.getElementById('againBtn').addEventListener('click', ()=>{ document.body.removeChild(end); startGame(); });
  }

  startBtn.addEventListener('click', startGame);
  window.addEventListener('pointerdown', ()=>{ if(!audioCtx) setupAudio(); (audioCtx && audioCtx.resume()); }, {once:true});
})();
</script>
</body>
</html>
