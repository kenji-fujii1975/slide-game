<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Dodge Blocks</title>
  <style>
    :root {
      --bg: #0a2a6b; /* 背景を青色に変更 */
      --fg: #e2e8f0;
      --accent: #5eead4;
      --accent2: #a78bfa;
      --danger: #fb7185;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background: var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Hiragino Kaku Gothic ProN", Meiryo, "Noto Sans JP", sans-serif; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows: 1fr auto; }
    canvas { width:100%; height:100%; display:block; background: radial-gradient(1200px 800px at 50% -200px, #1d4ed8, #0a2a6b 60%); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
</body>
</html>
