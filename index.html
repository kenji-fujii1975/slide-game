<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Dodge Blocks (Frog vs Turtles)</title>
  <style>
    :root {
      --bg: #0a2a6b; /* 背景を青系に */
      --fg: #e2e8f0;
      --accent: #5eead4;
      --accent2: #a78bfa;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background: var(--bg); color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Hiragino Kaku Gothic ProN", Meiryo, "Noto Sans JP", sans-serif; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows: 1fr auto; }
    canvas { width:100%; height:100%; display:block; background: radial-gradient(1200px 800px at 50% -200px, #1d4ed8, #0a2a6b 60%); }

    .hud { position: fixed; inset: env(safe-area-inset-top) 0 auto 0; padding: 8px 12px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
    .badge { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 12px rgba(0,0,0,0.25); }

    .overlay { position: fixed; inset:0; display:grid; place-items:center; background: linear-gradient(180deg, rgba(10,42,107,0.55), rgba(10,42,107,0.85)); backdrop-filter: blur(4px); }
    .card { width:min(92vw, 520px); border-radius: 20px; padding: 20px; background: rgba(14,18,30,0.9); border:1px solid rgba(255,255,255,0.15); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
    .card h1 { margin: 6px 0 12px; font-size: clamp(20px, 5vw, 28px); letter-spacing: 0.02em; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn { pointer-events:auto; appearance:none; border:none; border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 700; color:#0b0f1a; background: var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,0.25), inset 0 -2px 0 rgba(0,0,0,0.25); }
    .btn.secondary { background: var(--accent2); color:#0b0f1a; }
    .btn.ghost { background: rgba(255,255,255,0.1); color: var(--fg); border:1px solid rgba(255,255,255,0.15); }
    .btn:active { transform: translateY(1px); }

    .controlsHint { position: fixed; inset:auto 0 env(safe-area-inset-bottom) 0; display:flex; justify-content:space-between; align-items:center; pointer-events:none; padding: 16px; opacity: 0.85; font-size: 12px; color: #cbd5e1; }
    .controlsHint .zone { width: 46%; text-align:center; padding: 10px 0; border: 1px dashed rgba(255,255,255,0.18); border-radius: 14px; background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="hud">
  <div class="badge" id="score">SCORE 0000</div>
  <div class="badge" id="best">BEST 0000</div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>🐸 Frog Dodge – Turtles Rain</h1>
    <p style="color:#c7d2fe">左/右タッチ（または傾き）でカエルを操作。落ちてくる<strong>亀</strong>を避け続けよう！</p>
    <ul style="margin: 0 0 12px 1.2em; line-height:1.6; color:#c7d2fe">
      <li>より<strong>ゆっくり</strong>な落下スピードに調整済み</li>
      <li>リスタート時のBGM二重再生を防止</li>
      <li>カエルに<strong>アニメーション</strong>、効果音追加 / 亀の落下</li>
    </ul>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="startBtn">START</button>
      <button class="btn secondary" id="tiltBtn">Enable Tilt</button>
      <button class="btn ghost" id="muteBtn">🔈 BGM/SFX</button>
    </div>
  </div>
</div>

<div class="controlsHint" id="touchHints" style="display:none">
  <div class="zone">⬅️ LEFT</div>
  <div class="zone">RIGHT ➡️</div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const menu = document.getElementById('menu');
  const startBtn = document.getElementById('startBtn');
  const tiltBtn = document.getElementById('tiltBtn');
  const muteBtn = document.getElementById('muteBtn');
  const touchHints = document.getElementById('touchHints');

  // DPR-aware canvas sizing
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // Game state
  const state = {
    running: false,
    time: 0,
    last: performance.now(),
    score: 0,
    best: parseInt(localStorage.getItem('db_best')||'0',10),
    player: { x: 0.5, y: 0.85, r: 18, vx: 0, animT: 0 },
    blocks: [],
    spawnAcc: 0,
    input: { left:false, right:false, tilt:0 },
    muted: false,
  };
  bestEl.textContent = `BEST ${state.best.toString().padStart(4,'0')}`;

  // Touch input
  let touchingLeft = false, touchingRight = false;
  function onTouch(e){ if (!state.running) return; for (const t of e.touches){ const half = window.innerWidth/2; if (t.clientX < half) touchingLeft = true; else touchingRight = true; } }
  function onEnd(){ touchingLeft=false; touchingRight=false; }
  window.addEventListener('touchstart', onTouch, {passive:true});
  window.addEventListener('touchmove', onTouch, {passive:true});
  window.addEventListener('touchend', onEnd, {passive:true});
  window.addEventListener('touchcancel', onEnd, {passive:true});

  // Optional tilt
  let tiltEnabled = false;
  tiltBtn.addEventListener('click', async () => {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const perm = await DeviceMotionEvent.requestPermission();
        if (perm !== 'granted') throw new Error('permission denied');
      }
      window.addEventListener('devicemotion', (ev) => {
        const ax = ev.accelerationIncludingGravity ? ev.accelerationIncludingGravity.x || 0 : 0;
        state.input.tilt = Math.max(-1, Math.min(1, -ax/5));
      });
      tiltEnabled = true;
      tiltBtn.textContent = 'Tilt ✅';
    } catch(e){ alert('デバイスの傾き取得が許可されませんでした'); }
  });

  // Audio (BGM + SFX)
  let audioCtx, masterGain, bgmGain, sfxGain, bgmTimer=null, bgmRunning=false;
  function setupAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = 1.0; masterGain.connect(audioCtx.destination);
    bgmGain = audioCtx.createGain(); bgmGain.gain.value = 0.12; bgmGain.connect(masterGain);
    sfxGain = audioCtx.createGain(); sfxGain.gain.value = 0.25; sfxGain.connect(masterGain);
  }

  function tone({type='square', freq=440, start=0, dur=0.1, vol=0.2, target= sfxGain}){
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    g.gain.value = 0; osc.connect(g).connect(target);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.start(start); osc.stop(start + dur + 0.05);
  }
  function noiseHat(start){
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate*0.05, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * (1 - i/data.length); }
    const src = audioCtx.createBufferSource();
    const g = audioCtx.createGain(); g.gain.value = 0.18;
    src.buffer = buffer; src.connect(g).connect(bgmGain); src.start(start);
  }

  function startBGM(){
    if (!audioCtx) setupAudio();
    if (state.muted) return;
    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer=null; }
    bgmRunning = true;
    // fade in
    bgmGain.gain.cancelScheduledValues(audioCtx.currentTime);
    bgmGain.gain.value = 0; bgmGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.15);

    const tempo = 140; const beat = 60/tempo; const now = audioCtx.currentTime + 0.05;
    const chords = [ [261.63,329.63,392.00], [196.00,246.94,392.00], [220.00,261.63,329.63], [174.61,220.00,261.63] ];
    const bars = 4, barLen = 4*beat;
    for (let bar=0; bar<bars; bar++){
      const t0 = now + bar*barLen; const chord = chords[bar%chords.length];
      // bass
      tone({type:'triangle', freq: chord[0]/2, start:t0+0*beat, dur:0.2, vol:0.28, target:bgmGain});
      tone({type:'triangle', freq: chord[0]/2, start:t0+2*beat, dur:0.2, vol:0.28, target:bgmGain});
      // hats
      for (let i=0;i<8;i++){ noiseHat(t0 + i*(beat/2)); }
      // lead
      for (let i=0;i<8;i++){ const n = chord[i%chord.length]; tone({type:'square', freq:n*2, start:t0 + i*(beat/2), dur:0.17, vol:0.22, target:bgmGain}); }
      // chord stabs
      for (let i=0;i<4;i++){ for (const n of chord){ tone({type:'square', freq:n, start:t0 + i*beat + beat*0.5, dur:0.13, vol:0.12, target:bgmGain}); } }
      // kick
      for (let i=0;i<4;i++){ tone({type:'sine', freq:80, start:t0 + i*beat, dur:0.12, vol:0.35, target:bgmGain}); }
    }
    const loopLen = bars*barLen;
    bgmTimer = setInterval(() => { if (!bgmRunning || state.muted) { clearInterval(bgmTimer); bgmTimer=null; return; } startBGM(); }, loopLen*1000);
  }
  function stopBGM(){ if (!audioCtx) return; bgmRunning=false; if (bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } const t=audioCtx.currentTime; bgmGain.gain.cancelScheduledValues(t); bgmGain.gain.setTargetAtTime(0.0, t, 0.05); }

  muteBtn.addEventListener('click', () => { state.muted = !state.muted; muteBtn.textContent = state.muted ? '🔇 MUTED' : '🔈 BGM/SFX'; if (!audioCtx) setupAudio(); if (state.muted) stopBGM(); else startBGM(); });

  // Simple SFX helpers
  function sfxMove(){ if (!audioCtx || state.muted) return; const t=audioCtx.currentTime; tone({type:'square', freq:900, start:t, dur:0.03, vol:0.12}); }
  function sfxSpawn(){ if (!audioCtx || state.muted) return; const t=audioCtx.currentTime; tone({type:'square', freq:500, start:t, dur:0.05, vol:0.15}); }
  function sfxHit(){ if (!audioCtx || state.muted) return; const t=audioCtx.currentTime; tone({type:'triangle', freq:120, start:t, dur:0.25, vol:0.35}); tone({type:'sawtooth', freq:60, start:t+0.02, dur:0.25, vol:0.25}); }

  // Game helpers
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }

  function reset(){
    state.time=0; state.score=0; state.blocks.length=0; state.spawnAcc=0;
    state.player.x=0.5; state.player.vx=0; state.player.animT=0;
    touchingLeft = touchingRight = false;
  }

  function spawnBlock(){
    const w = window.innerWidth, h = window.innerHeight;
    const size = rand(Math.max(34, w*0.06), Math.max(60, w*0.12));
    const x = rand(size/2, w - size/2);
    const speed = rand(12, 24) + state.time*0.3; // とてもゆっくり（前回のさらに半分）
    state.blocks.push({ x, y: -size, w: size, h: size*0.75, vy: speed, rot: rand(-0.1,0.1) });
    sfxSpawn();
  }

  function collideCircleRect(cx, cy, r, rx, ry, rw, rh){
    const nx = clamp(cx, rx, rx+rw); const ny = clamp(cy, ry, ry+rh); const dx = cx-nx, dy = cy-ny; return (dx*dx + dy*dy) <= r*r;
  }

  // Drawing: Frog with animation (bobbing + blink)
  function drawFrog(x, y, r, t){
    const bob = Math.sin(t*4) * 3; // ささやかな上下
    const squash = 1 + Math.sin(t*8) * 0.03; // ほんの少しの伸縮
    const blink = (Math.floor((t%5)*10)===0); // おおよそ5秒に一瞬瞬き

    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(squash, 1/squash);

    // body
    ctx.fillStyle = '#22c55e';
    ctx.beginPath(); ctx.arc(0,0, r, 0, Math.PI*2); ctx.fill();

    // eyes
    const ey = -r*0.7, ex = r*0.55;
    ctx.fillStyle = 'white';
    if (!blink){
      ctx.beginPath(); ctx.arc(-ex, ey, r*0.22, 0, Math.PI*2); ctx.arc(ex, ey, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(-ex, ey, r*0.09, 0, Math.PI*2); ctx.arc(ex, ey, r*0.09, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.strokeStyle = 'black'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-ex - r*0.2, ey); ctx.lineTo(-ex + r*0.2, ey); ctx.moveTo(ex - r*0.2, ey); ctx.lineTo(ex + r*0.2, ey); ctx.stroke();
    }

    // mouth
    ctx.strokeStyle = 'black'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, r*0.15, r*0.45, 0, Math.PI); ctx.stroke();

    ctx.restore();
  }

  // Drawing: Turtle
  function drawTurtle(x, y, w, h, rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    // shell
    const shellGrad = ctx.createLinearGradient(0, -h/2, 0, h/2);
    shellGrad.addColorStop(0, '#0f9f6e'); shellGrad.addColorStop(1, '#065f46');
    ctx.fillStyle = shellGrad; ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2); ctx.fill();
    // scutes lines
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.strokeRect(-w*0.35, -h*0.25, w*0.7, h*0.5);
    // head
    ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.ellipse(w*0.55, -h*0.05, w*0.18, h*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(w*0.67, -h*0.08, Math.max(1.5, w*0.025), 0, Math.PI*2); ctx.fill();
    // legs
    ctx.fillStyle = '#16a34a';
    ctx.beginPath(); ctx.ellipse(-w*0.35, -h*0.45, w*0.14, h*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w*0.05, -h*0.45, w*0.14, h*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-w*0.35, h*0.45, w*0.14, h*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w*0.05, h*0.45, w*0.14, h*0.18, 0, 0, Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function draw(){
    const w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0,0,w,h);

    // subtle grid
    ctx.globalAlpha = 0.08; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    for (let y=0; y<h; y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    for (let x=0; x<w; x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    ctx.globalAlpha = 1;

    // Frog
    const px = state.player.x * w, py = state.player.y * h; drawFrog(px, py, state.player.r, state.player.animT/1000);

    // Turtles (blocks)
    for (const b of state.blocks){ drawTurtle(b.x, b.y, b.w, b.h, b.rot); }

    // vignette
    const vg = ctx.createRadialGradient(w/2, h*0.4, Math.min(w,h)*0.1, w/2, h/2, Math.max(w,h)*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,w,h);
  }

  function update(dt){
    const w = window.innerWidth, h = window.innerHeight;

    // input
    const moving = (touchingLeft || touchingRight || Math.abs(state.input.tilt) > 0.05);
    const target = (touchingLeft? -1:0) + (touchingRight? 1:0) + (tiltEnabled? state.input.tilt*1.2 : 0);
    const accel = 2.6;
    const prevVx = state.player.vx;
    state.player.vx += target * accel * dt / 16.67; state.player.vx *= 0.88;
    state.player.x += (state.player.vx * dt) / w; state.player.x = clamp(state.player.x, 0.05, 0.95);
    if (moving && Math.sign(prevVx) !== Math.sign(state.player.vx)) { sfxMove(); }

    // spawn
    state.spawnAcc += dt;
    const spawnEvery = Math.max(420, 1400 - state.time*1.4); // さらに控えめ
    while (state.spawnAcc > spawnEvery) { state.spawnAcc -= spawnEvery; spawnBlock(); }

    // move turtles
    for (const b of state.blocks){ b.y += b.vy * dt/1000; b.rot += 0.0005 * dt; }
    state.blocks = state.blocks.filter(b => b.y < h + b.h);

    // collisions
    const px2 = state.player.x * w, py2 = state.player.y * h, pr = state.player.r;
    for (const b of state.blocks){ if (collideCircleRect(px2, py2, pr, b.x - b.w/2, b.y - b.h/2, b.w, b.h)) { sfxHit(); endGame(); return; } }

    // score/time
    state.time += dt; state.player.animT += dt; state.score = Math.floor(state.time / 10); scoreEl.textContent = `SCORE ${state.score.toString().padStart(4,'0')}`;
  }

  function gameLoop(){ if (!state.running) return; const now=performance.now(); let dt=now-state.last; if (dt>80) dt=80; state.last=now; update(dt); draw(); requestAnimationFrame(gameLoop); }

  function startGame(){
    reset(); state.running = true; state.last = performance.now(); menu.style.display='none'; touchHints.style.display='flex';
    if (!state.muted){ setupAudio(); audioCtx.resume(); startBGM(); }
    requestAnimationFrame(gameLoop);
  }

  function endGame(){
    state.running = false; stopBGM(); touchHints.style.display='none';
    if (state.score > state.best){ state.best = state.score; localStorage.setItem('db_best', String(state.best)); }
    bestEl.textContent = `BEST ${state.best.toString().padStart(4,'0')}`;

    const again = document.createElement('div'); again.className='overlay';
    again.innerHTML = `
      <div class="card">
        <h1>Game Over 💥</h1>
        <p style="color:#c7d2fe">Score: <strong>${state.score}</strong></p>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="againBtn">RETRY</button>
          <button class="btn ghost" id="shareBtn">Share</button>
        </div>
      </div>`;
    document.body.appendChild(again);
    document.getElementById('againBtn').addEventListener('click', () => { document.body.removeChild(again); startGame(); });
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const text = `Frog Dodgeで${state.score}点！`; if (navigator.share){ try { await navigator.share({ text }); } catch(e){} } else { navigator.clipboard?.writeText(text); alert('スコアをコピーしました！'); }
    });
    menu.style.display='grid';
  }

  startBtn.addEventListener('click', startGame);
  window.addEventListener('pointerdown', () => { if (!audioCtx) setupAudio(); audioCtx?.resume(); }, { once:true });
})();
</script>
</body>
</html>
