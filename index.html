<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Frog Dodge – Lite Test</title>
  <style>
    :root { --fg:#e2e8f0; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:#0a2a6b; color:var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Hiragino Kaku Gothic ProN", Meiryo, "Noto Sans JP", sans-serif; }
    #wrap { position:fixed; inset:0; display:grid; grid-template-rows: 1fr auto; }
    canvas { width:100%; height:100%; display:block; }

    .hud { position:fixed; inset: env(safe-area-inset-top) 0 auto 0; padding:8px 12px; display:flex; gap:8px; pointer-events:none; }
    .badge { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); padding:6px 10px; border-radius:999px; font-variant-numeric: tabular-nums; box-shadow:0 2px 12px rgba(0,0,0,0.25); }

    .overlay { position:fixed; inset:0; display:grid; place-items:center; background: rgba(0,0,0,0.45); }
    .card { width:min(92vw,560px); border-radius:20px; padding:20px; background: rgba(14,18,30,0.9); border:1px solid rgba(255,255,255,0.15); box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    .card h1 { margin:6px 0 12px; font-size: clamp(20px,5vw,28px); }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn { pointer-events:auto; appearance:none; border:none; border-radius:14px; padding:12px 16px; font-size:16px; font-weight:700; color:#0b0f1a; background:#5eead4; box-shadow:0 4px 14px rgba(0,0,0,0.25), inset 0 -2px 0 rgba(0,0,0,0.25); }
    .btn.ghost { background: rgba(255,255,255,0.1); color:var(--fg); border:1px solid rgba(255,255,255,0.15); }

    .controlsHint { position: fixed; inset:auto 0 env(safe-area-inset-bottom) 0; display:flex; justify-content:space-between; align-items:center; pointer-events:none; padding:16px; opacity:0.85; font-size:12px; color:#cbd5e1; }
    .controlsHint .zone { width:46%; text-align:center; padding:10px 0; border:1px dashed rgba(255,255,255,0.18); border-radius:14px; background: rgba(255,255,255,0.03); }
  </style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>

<div class="hud">
  <div class="badge" id="stage">STAGE 1</div>
  <div class="badge" id="timer">TIME 30.0s</div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>🐸 Frog Dodge – Lite Test</h1>
    <p style="color:#c7d2fe">音声や高度な機能を外した<strong>軽量テスト版</strong>。<br>ボタンが確実に反応するか＆描画が動くかを確認します。</p>
    <ul style="margin:0 0 12px 1.2em; line-height:1.6; color:#c7d2fe">
      <li>ステージ1: 青 / 亀（一定速度）30秒</li>
      <li>ステージ2: 緑 / 蟹（一定速度）30秒</li>
      <li>ステージ3: 黒 / 蛇（一定速度）30秒 → エンディング</li>
      <li>画面左右タッチで移動（傾き・BGMなし）</li>
    </ul>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="startBtn">START</button>
      <button class="btn ghost" id="reloadBtn">HARD RELOAD</button>
    </div>
  </div>
</div>

<div class="controlsHint" id="touchHints" style="display:none">
  <div class="zone">⬅️ LEFT</div>
  <div class="zone">RIGHT ➡️</div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const stageEl = document.getElementById('stage');
  const timerEl = document.getElementById('timer');
  const menu = document.getElementById('menu');
  const startBtn = document.getElementById('startBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const touchHints = document.getElementById('touchHints');

  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  function resize(){ const w=innerWidth, h=innerHeight; cv.width=Math.floor(w*dpr); cv.height=Math.floor(h*dpr); cv.style.width=w+'px'; cv.style.height=h+'px'; ctx.setTransform(dpr,0,0,dpr,0,0);} window.addEventListener('resize', resize, {passive:true}); resize();

  const STAGES = [
    { name:'STAGE 1', secs:30, bg:'#0a2a6b', bg2:'#1d4ed8', enemy:'turtle', speed:[21,30], spawnEvery:1000 },
    { name:'STAGE 2', secs:30, bg:'#064e3b', bg2:'#16a34a', enemy:'crab',   speed:[24,33], spawnEvery:950  },
    { name:'STAGE 3', secs:30, bg:'#000000', bg2:'#111827', enemy:'snake',  speed:[27,36], spawnEvery:900  },
  ];

  const state = { running:false, stageIdx:0, stageElapsed:0, last:performance.now(), player:{ x:0.5, y:0.85, r:18, vx:0, animT:0 }, blocks:[], spawnAcc:0 };

  // input (touch left/right)
  let touchingLeft=false, touchingRight=false;
  function onTouch(e){ if(!state.running) return; touchingLeft=false; touchingRight=false; const half=innerWidth/2; for(const t of e.touches){ if(t.clientX<half) touchingLeft=true; else touchingRight=true; } }
  function onEnd(){ touchingLeft=false; touchingRight=false; }
  addEventListener('touchstart', onTouch, {passive:true});
  addEventListener('touchmove', onTouch, {passive:true});
  addEventListener('touchend', onEnd, {passive:true});
  addEventListener('touchcancel', onEnd, {passive:true});

  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function rand(a,b){ return a + Math.random()*(b-a); }

  function resetForStage(){ state.blocks.length=0; state.spawnAcc=0; state.stageElapsed=0; state.player.x=0.5; state.player.vx=0; state.player.animT=0; touchHints.style.display='flex'; stageEl.textContent = STAGES[state.stageIdx].name; updateTimerBadge(); }
  function updateTimerBadge(){ const remain=Math.max(0, STAGES[state.stageIdx].secs*1000 - state.stageElapsed); timerEl.textContent = `TIME ${(remain/1000).toFixed(1)}s`; }

  function spawnBlock(){ const cfg=STAGES[state.stageIdx]; const w=innerWidth; const size=rand(Math.max(34,w*0.06), Math.max(60,w*0.12)); const x=rand(size/2, w-size/2); const speed=rand(cfg.speed[0], cfg.speed[1]); state.blocks.push({ x, y:-size, w:size, h:size*0.75, vy:speed, rot:rand(-0.1,0.1) }); }

  function collideCircleRect(cx,cy,r, rx,ry,rw,rh){ const nx=clamp(cx,rx,rx+rw), ny=clamp(cy,ry,ry+rh); const dx=cx-nx, dy=cy-ny; return (dx*dx+dy*dy)<=r*r; }

  // drawing helpers
  function drawBackground(){ const {bg,bg2}=STAGES[state.stageIdx]; const w=innerWidth, h=innerHeight; const g=ctx.createRadialGradient(w/2,h*0.1,Math.min(w,h)*0.1, w/2,h/2,Math.max(w,h)*0.9); g.addColorStop(0,bg2); g.addColorStop(1,bg); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); }
  function drawGrid(){ const w=innerWidth,h=innerHeight; ctx.globalAlpha=0.08; ctx.strokeStyle='#ffffff'; for(let y=0;y<h;y+=32){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); } for(let x=0;x<w;x+=32){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); } ctx.globalAlpha=1; }
  function drawFrog(x,y,r,t){ const bob=Math.sin(t*4)*3, squash=1+Math.sin(t*8)*0.03, blink=(Math.floor((t%5)*10)===0); ctx.save(); ctx.translate(x,y+bob); ctx.scale(squash,1/squash); ctx.fillStyle='#22c55e'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); const ey=-r*0.7, ex=r*0.55; ctx.fillStyle='white'; if(!blink){ ctx.beginPath(); ctx.arc(-ex,ey,r*0.22,0,Math.PI*2); ctx.arc(ex,ey,r*0.22,0,Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-ex,ey,r*0.09,0,Math.PI*2); ctx.arc(ex,ey,r*0.09,0,Math.PI*2); ctx.fill(); } else { ctx.strokeStyle='black'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-ex-r*0.2,ey); ctx.lineTo(-ex+r*0.2,ey); ctx.moveTo(ex-r*0.2,ey); ctx.lineTo(ex+r*0.2,ey); ctx.stroke(); } ctx.strokeStyle='black'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,r*0.15,r*0.45,0,Math.PI); ctx.stroke(); ctx.restore(); }
  function drawTurtle(x,y,w,h,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); const shellGrad=ctx.createLinearGradient(0,-h/2,0,h/2); shellGrad.addColorStop(0,'#0f9f6e'); shellGrad.addColorStop(1,'#065f46'); ctx.fillStyle=shellGrad; ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.strokeRect(-w*0.35,-h*0.25,w*0.7,h*0.5); ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.ellipse(w*0.55,-h*0.05,w*0.18,h*0.18,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(w*0.67,-h*0.08,Math.max(1.5,w*0.025),0,Math.PI*2); ctx.fill(); ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.ellipse(-w*0.35,-h*0.45,w*0.14,h*0.18,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(0.05*w,-h*0.45,w*0.14,h*0.18,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(-w*0.35,h*0.45,w*0.14,h*0.18,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(0.05*w,h*0.45,w*0.14,h*0.18,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  function drawCrab(x,y,w,h,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); const bodyW=w*0.7, bodyH=h*0.6; ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.ellipse(0,0,bodyW/2,bodyH/2,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(-bodyW*0.15,-bodyH*0.6,bodyH*0.12,0,Math.PI*2); ctx.arc(bodyW*0.15,-bodyH*0.6,bodyH*0.12,0,Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-bodyW*0.15,-bodyH*0.6,bodyH*0.06,0,Math.PI*2); ctx.arc(bodyW*0.15,-bodyH*0.6,bodyH*0.06,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#b91c1c'; ctx.lineWidth=3; for(let i=-3;i<=3;i+=2){ ctx.beginPath(); ctx.moveTo(-bodyW*0.4, bodyH*0.1*i/3); ctx.lineTo(-bodyW*0.7, bodyH*0.2*i/3); ctx.stroke(); ctx.beginPath(); ctx.moveTo(bodyW*0.4, bodyH*0.1*i/3); ctx.lineTo(bodyW*0.7, bodyH*0.2*i/3); ctx.stroke(); } ctx.fillStyle='#dc2626'; ctx.beginPath(); ctx.ellipse(-bodyW*0.9,-bodyH*0.05,bodyW*0.25,bodyH*0.25,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(bodyW*0.9,-bodyH*0.05,bodyW*0.25,bodyH*0.25,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  function drawSnake(x,y,w,h,rot){ ctx.save(); ctx.translate(x,y); ctx.rotate(rot); const len=h*1.2, thick=h*0.28; const grad=ctx.createLinearGradient(0,-len/2,0,len/2); grad.addColorStop(0,'#22c55e'); grad.addColorStop(1,'#15803d'); ctx.fillStyle=grad; // simple rect snake (no roundRect)
    ctx.fillRect(-thick/2, -len/2, thick, len); ctx.fillStyle='#16a34a'; ctx.beginPath(); ctx.ellipse(0,-len/2,thick*0.9,thick*0.9,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(-thick*0.25,-len/2,thick*0.12,0,Math.PI*2); ctx.arc(thick*0.25,-len/2,thick*0.12,0,Math.PI*2); ctx.fill(); ctx.restore(); }

  function draw(){ drawBackground(); drawGrid(); const w=innerWidth,h=innerHeight; const px=state.player.x*w, py=state.player.y*h; drawFrog(px,py,state.player.r,state.player.animT/1000); const enemy=STAGES[state.stageIdx].enemy; for(const b of state.blocks){ if(enemy==='turtle') drawTurtle(b.x,b.y,b.w,b.h,b.rot); else if(enemy==='crab') drawCrab(b.x,b.y,b.w,b.h,b.rot); else drawSnake(b.x,b.y,b.w,b.h,b.rot);} }

  function update(dt){ const w=innerWidth,h=innerHeight; const target=(touchingLeft?-1:0)+(touchingRight?1:0); const accel=1.5; state.player.vx += target*accel*dt/16.67; const maxVx=0.35*w/1000; if(state.player.vx>maxVx) state.player.vx=maxVx; if(state.player.vx<-maxVx) state.player.vx=-maxVx; state.player.vx *= 0.92; state.player.x += (state.player.vx*dt)/w; state.player.x = clamp(state.player.x,0.05,0.95);
    state.spawnAcc += dt; const cfg=STAGES[state.stageIdx]; while(state.spawnAcc > cfg.spawnEvery){ state.spawnAcc -= cfg.spawnEvery; spawnBlock(); }
    for(const b of state.blocks){ b.y += b.vy*dt/1000; b.rot += 0.0005*dt; }
    state.blocks = state.blocks.filter(b => b.y < h + b.h);
    const px=state.player.x*w, py=state.player.y*h, pr=state.player.r; for(const b of state.blocks){ if(collideCircleRect(px,py,pr, b.x-b.w/2, b.y-b.h/2, b.w, b.h)){ showGameOver(); return; } }
    state.stageElapsed += dt; state.player.animT += dt; updateTimerBadge(); if(state.stageElapsed >= cfg.secs*1000){ showStageClear(); }
  }

  function loop(){ if(!state.running) return; const now=performance.now(); let dt=now-state.last; if(dt>80) dt=80; state.last=now; update(dt); draw(); requestAnimationFrame(loop); }

  function startGame(){ state.stageIdx=0; resetForStage(); state.running=true; state.last=performance.now(); menu.style.display='none'; requestAnimationFrame(loop); }
  function nextStage(){ state.stageIdx++; if(state.stageIdx>=STAGES.length){ showEnding(); return; } resetForStage(); state.running=true; state.last=performance.now(); requestAnimationFrame(loop); }

  function showGameOver(){ state.running=false; touchHints.style.display='none'; const d=document.createElement('div'); d.className='overlay'; d.innerHTML=`<div class="card"><h1>Game Over</h1><div class="row"><button class="btn" id="retryBtn">RETRY</button></div></div>`; document.body.appendChild(d); document.getElementById('retryBtn').onclick=()=>{ document.body.removeChild(d); startGame(); } }
  function showStageClear(){ state.running=false; touchHints.style.display='none'; const clear=document.createElement('div'); clear.className='overlay'; clear.innerHTML=`<div class="card"><h1>GOAL ✅</h1><p style="color:#c7d2fe">${STAGES[state.stageIdx].name} クリア！</p><div class="row"><button class="btn" id="nextBtn">${state.stageIdx===STAGES.length-1?'ENDINGへ':'NEXT STAGE'}</button></div></div>`; document.body.appendChild(clear); document.getElementById('nextBtn').onclick=()=>{ document.body.removeChild(clear); nextStage(); } }
  function showEnding(){ const end=document.createElement('div'); end.className='overlay'; end.innerHTML=`<div class="card"><h1>🎉 CONGRATULATIONS!</h1><p style="color:#c7d2fe; line-height:1.7">3ステージをクリアしました。<br>Game Designer: <strong>KENJI FUJII</strong></p><div class="row"><button class="btn" id="againBtn">PLAY AGAIN</button></div></div>`; document.body.appendChild(end); document.getElementById('againBtn').onclick=()=>{ document.body.removeChild(end); startGame(); } }

  startBtn.addEventListener('click', startGame); startBtn.onclick = startGame; reloadBtn.onclick=()=>location.reload(true);
})();
</script>
</body>
</html>
